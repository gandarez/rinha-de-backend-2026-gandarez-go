global
    daemon
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option http-keep-alive
    option forwardfor
    no log

frontend http_in
    bind *:9999
    default_backend api

backend api
    balance roundrobin
    option http-keep-alive
    http-reuse always
    server api1 api1:9999 check
    server api2 api2:9999 check
