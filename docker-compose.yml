services:
  api1:
    image: ghcr.io/gandarez/rinha-de-backend-2026-gandarez-go:latest
    hostname: api1
    environment:
      PORT: "9999"
      GOMAXPROCS: "1"
      GOMEMLIMIT: "140MiB"
    networks:
      - rinha
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api2:
    image: ghcr.io/gandarez/rinha-de-backend-2026-gandarez-go:latest
    hostname: api2
    environment:
      PORT: "9999"
      GOMAXPROCS: "1"
      GOMEMLIMIT: "140MiB"
    networks:
      - rinha
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
